name: Container Query Policy

on:
  pull_request:
    paths:
      - 'src/styles/**/*.css'

jobs:
  cq:
    name: Enforce Container Query Policy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Check container query policy
        run: npm run lint:cq
